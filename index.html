<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="description" content="Convierte soles y monedas de todo el mundo con el tipo de cambio del día.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paridad">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}*{box-sizing:border-box}img{max-width:100%}</style>
<title>Paridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Figtree:wght@400;500;600&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: app de una columna para celular — dos "billetes" (De / A) arriba, teclado de calculadora propio debajo, equivalencias al final */
:root {
  /* Paridad: negro profundo y oro champán, mismo look en tema claro u oscuro */
  --bg: #0b0b0a; --surface: #151513; --ink: #f3ede0; --muted: #9b937f;
  --line: #2a2823; --accent: #d9b25c; --accent-ink: #15110a; --chip: #201e1a; --key: #191815; --scrim: rgba(0,0,0,.65);
  --gold-grad: linear-gradient(135deg, #f7e3a3 0%, #d9b25c 45%, #a77a2c 100%);
  --brand: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 32px; display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; margin: 0; }
.stamp { font-family: var(--mono); font-size: .7rem; color: var(--muted); }

.bill { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
.bill.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cur-btn { display: flex; align-items: center; gap: 8px; border: 0; background: var(--chip); color: var(--ink); border-radius: 999px;
  padding: 6px 12px 6px 8px; font: 600 .9rem var(--body); cursor: pointer; justify-self: start; max-width: 100%; }
.cur-btn .flag { font-size: 1.25rem; line-height: 1; }
.cur-btn .cname { font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cur-btn .caret { color: var(--muted); font-size: .7rem; }
.num { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; font-size: clamp(1.6rem, 8.5vw, 2.3rem);
  text-align: right; overflow-wrap: anywhere; line-height: 1.15; min-height: 1.15em; }
.num.out { color: var(--accent); }
.mid { display: flex; align-items: center; gap: 10px; }
.mid .rate { flex: 1; min-width: 0; font-family: var(--mono); font-size: .76rem; color: var(--muted); }
.swap { flex: none; height: 40px; width: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; }

.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; user-select: none; }
.k { height: 58px; border-radius: 14px; border: 1px solid var(--line); background: var(--key); color: var(--ink);
  font: 500 1.4rem var(--mono); cursor: pointer; touch-action: manipulation; }
.k:active { background: var(--chip); transform: scale(.97); }
.k.fn { font-family: var(--body); font-size: 1rem; font-weight: 600; color: var(--muted); }
.k.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font: 600 .95rem var(--body); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.board { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 6px; }
.board-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.board-head h2 { font-family: var(--display); font-size: 1rem; margin: 0; overflow-wrap: anywhere; }
.board-head p { margin: 2px 0 0; color: var(--muted); font-size: .8rem; }
.row { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:active, .row:hover { background: var(--chip); }
.row .flag { font-size: 1.2rem; text-align: center; }
.row .who { min-width: 0; display: grid; }
.row .who b { font-family: var(--mono); font-size: .8rem; }
.row .who span { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .88rem; text-align: right; }
.more { display: none; width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--surface); color: var(--accent); font: 600 .9rem var(--body); padding: 12px; cursor: pointer; }
.note { color: var(--muted); font-size: .76rem; line-height: 1.5; margin: 0; }

/* Selector de moneda: hoja que sube desde abajo */
.sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 460px; margin: 0 auto; max-height: 82%;
  background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-top { padding: 12px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.sheet-top .bar { display: flex; justify-content: space-between; align-items: center; }
.sheet-top h3 { margin: 0; font-family: var(--display); font-size: 1.05rem; }
.close { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 .85rem var(--body); cursor: pointer; }
.search { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 500 1rem var(--body); }
.list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.list .sec { padding: 8px 16px 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.list .row { grid-template-columns: 26px 1fr auto; }
.list .row .val { color: var(--muted); font-size: .8rem; }
.empty { padding: 20px 16px; color: var(--muted); font-size: .9rem; }
/* Fila única: "Tengo" a la izquierda, "Recibo" a la derecha */
.main { display: grid; gap: 12px; min-width: 0; }
.pairrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.bill { min-width: 0; align-content: start; }
.tag { font-size: .66rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.pairrow .num { font-size: clamp(1.05rem, 5.4vw, 2.6rem); }
.pairrow .cur-btn { padding: 5px 10px 5px 6px; font-size: .85rem; }
.kbd-hint { display: none; font-size: .76rem; color: var(--muted); }
#rows { display: grid; }

/* Banderas: fuente de emojis propia para que se vean también en Windows */
.flag { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
.num { white-space: nowrap; overflow: hidden; }

/* Celular: una encima de otra, el botón de intercambio al medio */
@media (max-width: 640px) {
  .pairrow { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .pairrow .swap { justify-self: center; transform: rotate(90deg); height: 38px; width: 38px; margin-block: -4px; position: relative; z-index: 1; }
  .pairrow .num { font-size: 2.2rem; }
  .bill { grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; }
  .bill .tag { grid-column: 1 / -1; }
  .bill .num { text-align: right; min-width: 0; }
  .pairrow .cur-btn .cname { display: none; }
}

/* Computadora (mouse): sin teclado en pantalla, se escribe con el teclado físico */
@media (hover: hover) and (pointer: fine) {
  .pad { display: none; }
  .kbd-hint { display: block; }
  .bill.active .num::after { content: ""; display: inline-block; width: 2px; height: .9em; margin-left: 3px; vertical-align: -.08em;
    background: var(--accent); animation: blink 1s steps(1) infinite; }
}
@keyframes blink { 50% { opacity: 0; } }

/* Pantalla grande: más amplio, equivalencias en varias columnas para que no quede vacío */
@media (min-width: 900px) {
  .wrap { max-width: 1080px; padding-block: 36px 48px; gap: 18px; }
  h1 { font-size: 1.9rem; }
  .bill { padding: 20px 22px; gap: 10px; border-radius: 20px; }
  .pairrow { gap: 14px; }
  .pairrow .num { font-size: clamp(2rem, 3.4vw, 3rem); }
  .swap { height: 52px; width: 52px; font-size: 1.3rem; }
  .mid { justify-content: space-between; }
  .mid .rate { flex: none; font-size: .85rem; }
  .board { border-radius: 20px; }
  .board-head { padding: 16px 20px; }
  #rows { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  #rows .row { border-right: 1px solid var(--line); padding: 14px 20px; }
  .note { max-width: 70ch; }
}

/* Encabezado con logo y estado del tipo de cambio */
header { align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 42px; height: 42px; flex: none; border-radius: 11px; }
.tagline { margin: 0; font-size: .74rem; color: var(--muted); }
.status { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 6px 10px; font: 500 .72rem var(--body); cursor: pointer; white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status.live .dot { background: #22b573; box-shadow: 0 0 0 3px rgba(34,181,115,.18); }
.status.old .dot { background: #e0a020; }
.status.loading .dot { animation: blink 1s steps(1) infinite; }
@media (max-width: 640px) { h1 { font-size: 1.2rem; white-space: nowrap; } .tagline { font-size: .7rem; } }
@media (max-width: 380px) { .tagline { display: none; } }
@media (min-width: 900px) { .logo { width: 54px; height: 54px; border-radius: 14px; } .tagline { font-size: .85rem; } .status { font-size: .8rem; padding: 8px 14px; } }

/* Toques de marca */
h1 { font-family: var(--brand); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 1.25rem; }
.logo { border-radius: 12px; box-shadow: 0 0 0 1px rgba(217,178,92,.25); }
.num.out { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.k.go { background: var(--gold-grad); border-color: transparent; }
.bill.active { box-shadow: 0 0 0 1px var(--accent) inset, 0 0 24px rgba(217,178,92,.08); }
.status.live .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(217,178,92,.18); }
.row .who b, .cur-btn { letter-spacing: .02em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .k:active { transform: none; } }

/* ===== v2: teclado del celular y más vida ===== */
html, body { overflow-x: clip; }
.tape { overflow: hidden; margin-inline: -16px; border-block: 1px solid var(--line); background: #0e0e0c;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
.tape-in { display: inline-flex; white-space: nowrap; animation: tape 42s linear infinite; will-change: transform; }
.tape:hover .tape-in, .tape:active .tape-in { animation-play-state: paused; }
.grp { display: inline-flex; gap: 26px; padding: 9px 26px 9px 0; }
@keyframes tape { to { transform: translateX(-50%); } }
.tick { display: inline-flex; align-items: center; gap: 6px; font: 600 .78rem var(--mono); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; }
.tick .flag { font-size: 1rem; }
.tick .p { color: var(--muted); font-weight: 500; }
.up { color: #5fd08f; } .dn { color: #f0806e; } .eq { color: var(--muted); }
input.num { width: 100%; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink); padding: 0; margin: 0; caret-color: var(--accent); }
input.num::placeholder { color: var(--muted); }
#billFrom { cursor: text; }
.bill:focus-within { box-shadow: 0 0 0 1px var(--accent) inset, 0 0 30px rgba(217,178,92,.16); }
.swap { transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.trend { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.trend svg { flex: 1; height: 28px; min-width: 0; overflow: visible; }
.trend polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.trend span { font: 600 .74rem var(--mono); white-space: nowrap; }
.chipbtn { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 .8rem var(--body); cursor: pointer; }
#copyKey { margin-left: auto; }
.chipbtn.info { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; color: var(--muted); font-size: 1rem; }
.chipbtn.done { background: var(--gold-grad); color: var(--accent-ink); border-color: transparent; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.b2-title { font-family: var(--display); font-size: .95rem; font-weight: 600; color: var(--muted); margin: 4px 0 10px; overflow-wrap: anywhere; }
#rows.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; text-align: left; color: var(--ink);
  cursor: pointer; font: inherit; min-width: 0; animation: pop .5s cubic-bezier(.3,1.3,.5,1) both; transition: border-color .2s, transform .15s; }
.card:hover { border-color: var(--accent); } .card:active { transform: scale(.97); }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .flag { font-size: 1.7rem; line-height: 1; }
.card .code { font: 600 .78rem var(--mono); color: var(--muted); letter-spacing: .04em; }
.card .v { font: 600 1.08rem var(--mono); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ch { font: 600 .72rem var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.92); } }
.bump { animation: bump .4s ease; }
@keyframes bump { 40% { transform: scale(1.04); } }
@media (min-width: 640px) { #rows.cards { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
@media (min-width: 900px) { .tape { margin-inline: 0; border-radius: 14px; border: 1px solid var(--line); } }
@media (prefers-reduced-motion: reduce) { .tape-in { animation: none; } }
/* ===== Propuesta B: celular sin tarjetas, gráfico grande, montos rápidos ===== */
.trend { display: none !important; }
@media (max-width: 640px) { #boardSec { display: none; } }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 15px; font: 600 .85rem var(--mono); cursor: pointer; transition: border-color .2s, background .2s; }
.quick button.on { border-color: var(--accent); background: rgba(217,178,92,.12); color: var(--accent); }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chart-title { font: 600 .8rem var(--mono); color: var(--muted); }
.seg { display: flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: 600 .75rem var(--body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); }
.chart svg { width: 100%; height: 130px; display: block; margin-top: 12px; overflow: visible; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease forwards; }
.chart .area { opacity: 0; animation: fadein .9s .5s forwards; }
.chart .dot { fill: #f7e3a3; filter: drop-shadow(0 0 6px rgba(247,227,163,.8)); opacity: 0; animation: fadein .3s 1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
.ends { display: flex; justify-content: space-between; font: 500 .72rem var(--mono); color: var(--muted); margin-top: 8px; }
.insight { font: 500 1.05rem/1.45 var(--body); margin: 14px 0 0; }
.insight b { font-weight: 700; }
.insight .tip { display: block; color: var(--muted); font-size: .85rem; font-weight: 500; margin-top: 2px; }
@media (min-width: 900px) {
  .duo { display: grid; gap: 18px; }
  .chart svg { height: 170px; }
  #boardSec { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; }
  #boardSec .b2-title { margin: 0 0 6px; font: 600 .8rem var(--mono); }
  #rows.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; column-gap: 40px; row-gap: 0; }
  #rows .card { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 9px 2px; }
  #rows .card:hover { background: var(--chip); border-color: var(--line); }
  #rows .card .top { flex: 1 0 auto; justify-content: flex-start; gap: 10px; }
  #rows .card .v { flex: 0 1 auto; min-width: 0; }
  #rows .card .flag { font-size: 1.35rem; }
  #rows .card .code { color: var(--ink); }
  #rows .card .v { font-size: .95rem; text-align: right; }
  #rows .card .ch { width: 62px; text-align: right; flex: none; }
}
.card .nm { display: none; }
/* Pantalla ancha: conversor y gráfico a la izquierda, monedas a la derecha a toda la altura */
@media (min-width: 1200px) {
  .wrap { max-width: min(1760px, 94vw); grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); column-gap: 28px; align-items: start; }
  .wrap > header, .wrap > .tape { grid-column: 1 / -1; }
  .wrap > .main, .duo #chart { grid-column: 1; }
  .duo { display: contents; }
  #boardSec { grid-column: 2; grid-row: 3 / span 2; align-self: stretch; display: flex; flex-direction: column; }
  #rows.cards { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-flow: row; flex: 1; align-content: space-between; }
  #rows .card { padding: 13px 4px; }
  #rows .card .nm { display: block; color: var(--muted); font: 500 .85rem var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #rows .card .top { flex: 1 1 auto; min-width: 0; }
  #rows .card .flag { font-size: 1.6rem; }
  #rows .card .v { font-size: 1.05rem; }
  .chart svg { height: 230px; }
}
@media (prefers-reduced-motion: reduce) { .chart .line { stroke-dasharray: none; } .chart .area, .chart .dot { opacity: 1; } }
</style>
</head>
<body>


<div class="wrap">

  const svg = sec.querySelector("svg"), W = svg.clientWidth || 300, H = svg.clientHeight || 130;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const mn = Math.min(...s), mx = Math.max(...s);
  const pts = s.map((v, i) => [i / (s.length - 1) * (W - 8) + 4, mx === mn ? H / 2 : 10 + (1 - (v - mn) / (mx - mn)) * (H - 20)]);
  const d = "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
  const ln = $("line"), ar = $("area"), dot = $("dot");
  ln.setAttribute("d", d); ar.setAttribute("d", `${d} L${pts[pts.length - 1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`);
  dot.setAttribute("cx", pts[pts.length - 1][0]); dot.setAttribute("cy", pts[pts.length - 1][1]);
  ln.style.setProperty("--len", ln.getTotalLength());
  if (!quieto) for (const el of [ln, ar, dot]) { el.style.animation = "none"; void el.getBoundingClientRect(); el.style.animation = ""; }
  $("chartTitle").textContent = `1 ${a} en ${b}`;
  $("cMin").textContent = `mín ${fmt(mn)}`; $("cMax").textContent = `máx ${fmt(mx)}`;
  const ch = (s[s.length - 1] - s[0]) / s[0] * 100, per = RANGE === 7 ? "hace una semana" : "hace un mes", pct = Math.abs(ch).toFixed(1) + "%";
  let txt;
  if (Math.abs(ch) < 0.05) txt = `El precio está <b>igual</b> que ${per}.`;
  else if (b === "PEN") txt = `El ${lower(INFO[a].name)} está <b class="${ch > 0 ? "up" : "dn"}">${pct} más ${ch > 0 ? "caro" : "barato"}</b> que ${per}.<span class="tip">${ch > 0 ? "Buen momento para vender " + a + "." : "Buen momento para comprar " + a + "."}</span>`;
  else if (a === "PEN") txt = `Tus soles rinden <b class="${ch > 0 ? "up" : "dn"}">${pct} ${ch > 0 ? "más" : "menos"}</b> ${b} que ${per}.<span class="tip">${ch > 0 ? "Buen momento para cambiar a " + b + "." : "Conviene esperar si puedes."}</span>`;
  else txt = `1 ${a} te da <b class="${ch > 0 ? "up" : "dn"}">${pct} ${ch > 0 ? "más" : "menos"}</b> ${b} que ${per}.`;
  $("insight").innerHTML = txt;
}
$("seg").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  RANGE = +b.dataset.d; for (const x of $("seg").children) x.classList.toggle("on", x === b);
  chartKey = ""; drawChart();
  if (RANGE === 30) await loadHist(30);
});
let anchoGraf = 0;
addEventListener("resize", () => { const s2 = $("chart").querySelector("svg"), w = s2.clientWidth + s2.clientHeight * 1000; if (w && Math.abs(w - anchoGraf) > 4) { anchoGraf = w; chartKey = ""; drawChart(); } });

// ---- Cinta de monedas que se mueve ----
const TAPE = ["USD","EUR","CLP","CNY","VES","ARS","BOB","COP","BRL","MXN"];
function drawTape() {
  const html = TAPE.map(c => {
    return `<button type="button" class="tick" data-c="${c}"><span class="flag">${INFO[c].flag}</span>${c} <span class="p"></span><span class="c"></span></button>`;
  }).join("");
  $("tapeIn").innerHTML = `<span class="grp">${html}</span><span class="grp" aria-hidden="true">${html.replaceAll("<button ", '<button tabindex="-1" ')}</span>`;
  updateTape();
}
// Pone los precios de la cinta al día (cada minuto) sin reiniciar su movimiento
function updateTape() {
  for (const b of $("tapeIn").querySelectorAll(".tick")) {
    const c = b.dataset.c, p = 1 / RATES[c], ch = change(c, "PEN");
    b.querySelector(".p").textContent = p >= 0.1 ? `S/ ${p.toFixed(3)}` : `S/1 = ${fmt(RATES[c])}`;
    const e = b.querySelector(".c"); e.textContent = ch == null ? "" : arrow(ch); e.className = "c " + (ch == null ? "" : cls(ch));
  }
}
$("tapeIn").addEventListener("click", e => { const b = e.target.closest(".tick"); if (b) { state.from = b.dataset.c; state.to = "PEN"; render("pick"); } });

// ---- Resultado que cuenta hacia arriba ----
let shownOut = 0, outRaf, lastFrom = null;
function setOut(v, animate) {
  cancelAnimationFrame(outRaf); const el = $("outDisp");
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { shownOut = v; el.textContent = fmt(v); return; }
  const s = shownOut, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 520), e = 1 - Math.pow(1 - k, 3); shownOut = k < 1 ? s + (v - s) * e : v;
    el.textContent = fmt(shownOut); if (k < 1) outRaf = requestAnimationFrame(step); else fitNums(); };
  outRaf = requestAnimationFrame(step);
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
}
function drawTrend() {
  const t = $("trend"), s = series(state.from, state.to);
  if (s.length < 3) { t.hidden = true; return; }
  t.hidden = false;
  const mn = Math.min(...s), mx = Math.max(...s);
  $("spark").setAttribute("points", s.map((v, i) => `${(i / (s.length - 1) * 120).toFixed(1)},${mx === mn ? 14 : (26 - (v - mn) / (mx - mn) * 24).toFixed(1)}`).join(" "));
  const ch = change(state.from, state.to), e = $("trendTxt"); e.textContent = `${arrow(ch)} en 7 días`; e.className = cls(ch);
}
function drawCards(n, a) {
  const list = IMPORTANT.filter(c => c !== a), rows = $("rows");
  if (a !== lastFrom) {
    rows.innerHTML = "";
    list.forEach((c, i) => {
      const d = document.createElement("button"); d.type = "button"; d.className = "card"; d.dataset.c = c; d.title = INFO[c].name;
      d.style.animationDelay = (i * 45) + "ms";
      d.innerHTML = `<span class="top"><span class="flag">${INFO[c].flag}</span><span class="code">${c}</span><span class="nm">${INFO[c].name}</span></span><span class="v"></span><span class="ch"></span>`;
      d.addEventListener("click", () => { state.to = c; render("pick"); window.scrollTo({ top: 0, behavior: "smooth" }); });
      rows.appendChild(d);
    });
    lastFrom = a;
  }
  for (const d of rows.children) {
    const c = d.dataset.c, ch = change(a, c), e = d.querySelector(".ch");
    const v = d.querySelector(".v"), txt = fmt(convert(n, a, c));
    v.textContent = txt; v.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(v).fontSize);
    while (v.scrollWidth > v.clientWidth + 1 && fs > 10) { fs -= 1; v.style.fontSize = fs + "px"; }
    if (ch == null) { e.textContent = INFO[c].name; e.className = "ch eq"; } else { e.textContent = arrow(ch); e.className = "ch " + cls(ch); }
  }
}

function render(how) {
  const n = amount(), a = state.from, b = state.to;
  curBtn($("fromBtn"), a); curBtn($("toBtn"), b);
  if (document.activeElement !== $("inDisp")) $("inDisp").value = state.entry ? fmtEntry(state.entry) : "";
  setOut(convert(n, a, b), how !== "type" && how !== "hist");
  $("rate").textContent = `1 ${a} = ${fmt(convert(1, a, b))} ${b}`;
  $("boardTitle").textContent = `${state.entry ? fmtEntry(state.entry) : "0"} ${a} en otras monedas`;
  drawCards(n, a); drawTrend(); drawQuick(); drawChart(how === "hist" || how === "type"); fitNums(); save();
}
// Achica el número si no cabe en su recuadro, para que nunca se corte
function fitNums() {
  for (const el of [$("inDisp"), $("outDisp")]) {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && size > 11) { size -= 1; el.style.fontSize = size + "px"; }
  }
}
window.addEventListener("resize", fitNums);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNums);

function rowEl(c, val, onPick) {
  const d = document.createElement("div"); d.className = "row"; d.tabIndex = 0; d.setAttribute("role", "button");
  d.innerHTML = `<span class="flag">${INFO[c].flag}</span><span class="who"><b>${c}</b><span>${INFO[c].name}</span></span><span class="val">${val}</span>`;
  d.addEventListener("click", onPick); d.addEventListener("keydown", e => { if (e.key === "Enter") onPick(); });
  return d;
}

// ---- Monto con el teclado del celular (o el teclado físico en computadora) ----
const inp = $("inDisp");
inp.addEventListener("focus", () => { inp.value = state.entry; requestAnimationFrame(() => { try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }); });
inp.addEventListener("blur", () => render("type"));
inp.addEventListener("input", () => {
  let s = inp.value.replace(/,/g, ".").replace(/[^\d.]/g, "");
  const i = s.indexOf(".");
  if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, "").slice(0, 6);
  let [w, d] = s.split("."); w = (w || "").replace(/^0+(?=\d)/, "").slice(0, 15);
  s = d !== undefined ? (w || "0") + "." + d : w;
  if (inp.value !== s) inp.value = s;
  state.entry = s; render("type");
});
inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); else if (e.key === "Escape") { inp.value = ""; inp.dispatchEvent(new Event("input")); } });
$("billFrom").addEventListener("click", e => { if (!e.target.closest(".cur-btn")) inp.focus(); });
document.addEventListener("keydown", e => {
  if (!$("sheet").hidden) { if (e.key === "Escape") closeSheet(); return; }
  const t = document.activeElement; if (t && t.tagName === "INPUT") return;
  if (/^[0-9.,]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) inp.focus();
  else if (e.key === "Delete") { state.entry = ""; render("type"); }
});
$("copyKey").addEventListener("click", () => copy());
$("infoBtn").addEventListener("click", () => { const n = $("note"); n.hidden = !n.hidden; $("infoBtn").setAttribute("aria-expanded", String(!n.hidden)); });
async function copy() {
  const txt = `${fmtEntry(state.entry)} ${state.from} = ${$("outDisp").textContent} ${state.to}`;
  const k = $("copyKey");
  try { await navigator.clipboard.writeText(txt); k.textContent = "Copiado"; }
  catch (e) { const s = window.getSelection(), r = document.createRange(); r.selectNodeContents($("outDisp")); s.removeAllRanges(); s.addRange(r); k.textContent = "Listo"; }
  k.classList.add("done");
  setTimeout(() => { k.textContent = "Copiar"; k.classList.remove("done"); }, 1500);
}
let giro = 0;
$("swap").addEventListener("click", () => {
  giro += 180;
  $("swap").style.transform = (matchMedia("(max-width: 640px)").matches ? "rotate(90deg) " : "") + `rotate(${giro}deg)`;
  [state.from, state.to] = [state.to, state.from];
  render("swap");
});

// Selector de moneda
function openSheet(which) {
  picking = which; $("sheetTitle").textContent = which === "from" ? "Convertir desde" : "Convertir a";
  $("search").value = ""; fillList(""); $("sheetBg").hidden = false; $("sheet").hidden = false;
  document.body.style.overflow = "hidden";
}
function closeSheet() { $("sheetBg").hidden = true; $("sheet").hidden = true; document.body.style.overflow = ""; picking = null; }
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function fillList(q) {
  const list = $("list"); list.innerHTML = "";
  const nq = norm(q.trim());
  const match = c => !nq || norm(`${c} ${INFO[c].name} ${INFO[c].country} ${EXTRA[c] || ""}`).includes(nq);
  const pick = c => () => { state[picking] = c; closeSheet(); render(); };
  const current = state[picking];
  const add = (title, codes) => {
    const items = codes.filter(match); if (!items.length) return;
    const h = document.createElement("div"); h.className = "sec"; h.textContent = title; list.appendChild(h);
    for (const c of items) list.appendChild(rowEl(c, c === current ? "✓" : INFO[c].country, pick(c)));
  };
  if (!nq) add("Más usadas", POPULAR);
  add(nq ? "Resultados" : "Todas las monedas", CODES.slice().sort((x, y) => INFO[x].name.localeCompare(INFO[y].name, "es")));
  if (!list.children.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = `No hay monedas que coincidan con "${q}".`; list.appendChild(e); }
  list.scrollTop = 0;
}
$("fromBtn").addEventListener("click", () => openSheet("from"));
$("toBtn").addEventListener("click", () => openSheet("to"));
$("closeSheet").addEventListener("click", closeSheet);
$("sheetBg").addEventListener("click", closeSheet);
$("search").addEventListener("input", e => fillList(e.target.value));

// ---- Tipo de cambio en vivo: se descarga al abrir y se guarda para usar sin internet ----
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
const fmtFecha = d => `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
const esHoy = d => new Date().toDateString() === d.toDateString() || Date.now() - d.getTime() < 18 * 3600 * 1000;
let ratesDate = new Date(2026, 9, 13, 12, 0);
function applyRates(r, when) {
  for (const c of CODES) if (r[c] > 0) RATES[c] = r[c];
  ratesDate = when;
}
function showStatus(kind, text) {
  const b = $("status"); b.className = "status " + kind; $("statusText").textContent = text;
  $("note").textContent = `Tipo de cambio de mercado, actualizado el ${fmtFecha(ratesDate)} a las ${hhmm(ratesDate)}. Casas de cambio, bancos y tarjetas aplican su propio margen, así que el monto final puede variar.`;
}
// Fuente principal: precio de mercado al minuto (el mismo que muestra Google)
async function getCB() {
  const r = await fetch("https://api.coinbase.com/v2/exchange-rates?currency=PEN", { cache: "no-store" }); const j = await r.json();
  const rates = {}; for (const [k, v] of Object.entries(j.data.rates)) { const n = parseFloat(v); if (n > 0) rates[k] = n; }
  if (!(rates.USD > 0)) throw 0; return { rates, when: new Date(), live: true };
}
async function getER() {
  const r = await fetch("https://open.er-api.com/v6/latest/PEN", { cache: "no-store" }); const j = await r.json();
  if (j.result !== "success") throw 0; return { rates: j.rates, when: new Date(j.time_last_update_unix * 1000) };
}
async function getFawaz() {
  const r = await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/pen.json", { cache: "no-store" }); const j = await r.json();
  const rates = {}; for (const [k, v] of Object.entries(j.pen)) rates[k.toUpperCase()] = v;
  return { rates, when: new Date(j.date + "T12:00:00") };
}
const hhmm = d => d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: false });
async function loadRates(quiet) {
  if (!quiet) showStatus("loading", "Actualizando…");
  let res = await Promise.allSettled([getCB()]);
  if (res[0].status !== "fulfilled") res = await Promise.allSettled([getER(), getFawaz()]);
  const ok = res.filter(x => x.status === "fulfilled").map(x => x.value).sort((a, b) => b.when - a.when);
  if (ok.length) {
    applyRates(ok[0].rates, ok[0].when);
    try { localStorage.setItem("rates", JSON.stringify({ rates: ok[0].rates, when: ok[0].when.getTime() })); } catch (e) {}
    render("hist"); if (quiet) updateTape(); else drawTape();
    if (ok[0].live) { showStatus("live", `En vivo · ${hhmm(ratesDate)}`); return; }
    showStatus(esHoy(ratesDate) ? "live" : "old", esHoy(ratesDate) ? `Al día · ${ratesDate.getDate()} ${MESES[ratesDate.getMonth()]}` : `Último: ${ratesDate.getDate()} ${MESES[ratesDate.getMonth()]}`);
  } else {
    render(); showStatus(esHoy(ratesDate) ? "live" : "old", `${esHoy(ratesDate) ? "Al día" : "Último"} · ${ratesDate.getDate()} ${MESES[ratesDate.getMonth()]}`);
  }
}
try { const c = JSON.parse(localStorage.getItem("rates") || "null"); if (c && c.when > ratesDate.getTime()) applyRates(c.rates, new Date(c.when)); } catch (e) {}
$("status").addEventListener("click", loadRates);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 60 * 1000) { lastLoad = Date.now(); loadRates(); } });
let lastLoad = Date.now();
setInterval(() => { if (!document.hidden) { lastLoad = Date.now(); loadRates(true); } }, 60 * 1000);
drawTape();
render();
loadRates();
loadHist();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => {}));
</script>
